<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Studio — Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="topbar">
  <select id="episode-select"></select>
  <div id="progress"></div>
  <button id="export-btn" title="Download episode JSON (animation/video-AI ready)">⬇ JSON</button>
</header>
<main id="strip"><div class="loading">Loading…</div></main>

<!-- variant chooser overlay -->
<div id="overlay" class="hidden">
  <div id="overlay-inner">
    <div id="overlay-title"></div>
    <div id="variant-row"></div>
    <button id="overlay-close">Close</button>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
